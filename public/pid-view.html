<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>P&amp;IDs — PIMS</title>
  <link rel="preconnect" href="https://fonts.googleapis.com"/>
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin/>
  <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@300;400;500;600;700;800&display=swap" rel="stylesheet"/>
  <link rel="stylesheet" href="css/ll-suite.css"/>
  <style>
    .ll-shell { height:100vh; overflow:hidden; }
    .ll-body-row { flex:1; display:flex; min-height:0; }
    .ll-main { padding-top:1.25rem; overflow-y:auto; flex:1; }

    /* ── Job/Unit tree sidebar — same composition as user.html's own project
       tree (.tree-item/.tree-project/.tree-unit/.tree-children/.tree-count),
       copied here page-scoped rather than loading user.css's full 3200-line
       global stylesheet alongside ll-suite.css (real collision risk between
       two unscoped stylesheets). Colors match user.html's blue sidebar
       (--sb-bg #007bff family) directly rather than through shared tokens,
       since this panel is visually a sidebar, not a topbar. ── */
    .pidv-sidebar {
      width: 300px; flex-shrink: 0; background: #007bff;
      display: flex; flex-direction: column; overflow-y: auto;
      padding: 14px 8px;
    }
    .pidv-sidebar-label {
      font-size: 10px; font-weight: 700; letter-spacing: 0.09em; text-transform: uppercase;
      color: rgba(255,255,255,0.55); padding: 4px 10px 10px;
    }
    .tree-svg-icon { width: 13px; height: 13px; flex-shrink: 0; stroke: #cce4ff; display: inline-block; vertical-align: middle; }
    .tree-item {
      display: flex; align-items: center; gap: 6px;
      padding: 5px 9px; cursor: pointer;
      user-select: none; border-radius: 5px;
      color: #cce4ff; font-size: 12.5px; font-weight: 400;
      transition: background 0.15s, color 0.15s;
    }
    .tree-item:hover { background: rgba(255,255,255,0.12); color: #fff; }
    .tree-item:hover .tree-svg-icon { stroke: #fff; }
    .tree-item.selected { background: rgba(255,255,255,0.20); color: #fff; }
    .tree-item.selected .tree-svg-icon { stroke: #fff; }
    .project-item { font-weight: 600; color: rgba(255,255,255,0.9); }
    .project-item .tree-svg-icon { stroke: rgba(255,255,255,0.75); }
    .tree-children { margin-left: 14px; display: none; }
    .tree-count {
      margin-left: auto; font-size: 10px; flex-shrink: 0;
      background: rgba(255,255,255,0.18); color: #eaf4ff;
      border-radius: 6px; padding: 1px 6px;
    }
    .tree-empty { font-size: 11px; color: rgba(255,255,255,0.4); padding: 10px; font-style: italic; }

    /* ── Right-click context menu — same pattern as user.html's #iso-context
       (.ctx-menu), single action here. ── */
    .ctx-menu {
      position: absolute; background: #fff; border: 1px solid var(--border);
      border-radius: var(--radius); box-shadow: 0 8px 24px rgba(0,0,0,0.10), 0 2px 6px rgba(0,0,0,0.06);
      list-style: none; padding: 5px; display: none; z-index: 1000; min-width: 165px;
    }
    .ctx-menu li {
      display: flex; align-items: center; gap: 9px;
      padding: 8px 10px; border-radius: 6px; cursor: pointer; font-size: 13px;
      color: var(--text-primary); transition: background 0.15s;
    }
    .ctx-menu li svg { width: 14px; height: 14px; stroke: var(--text-muted); }
    .ctx-menu li:hover { background: var(--blue-50); }
    .ctx-menu li:hover svg { stroke: var(--blue-600); }

    .pidv-row-name { font-weight: 600; color: var(--text-primary); }
    .pidv-muted { color: var(--text-muted); font-size: 12px; }
    .pidv-rev-chip {
      font-family: monospace; font-size: 11.5px; font-weight: 700; padding: 2px 8px;
      border-radius: 100px; background: rgba(0,123,255,0.1); color: var(--blue-600);
    }
    .pidv-rev-chip.none { background: var(--gray-100); color: var(--text-muted); font-weight: 500; font-family: inherit; }
    .pidv-pending-chip {
      font-size: 11px; font-weight: 700; padding: 2px 7px; border-radius: 100px;
      background: rgba(217,119,6,0.12); color: #d97706; margin-left: 6px; cursor: default;
    }
    .pidv-pending-detail {
      padding: 10px 18px 14px; background: rgba(217,119,6,0.05);
      border-bottom: 1px solid var(--gray-100); font-size: 12px; color: var(--text-secondary); line-height: 1.7;
    }

    /* ── History modal (identical pattern to pid-index.html's) ── */
    .pidv-modal-overlay {
      display: none; position: fixed; inset: 0; background: rgba(15,23,42,0.45);
      z-index: 200; align-items: center; justify-content: center;
    }
    .pidv-modal-overlay.open { display: flex; }
    .pidv-modal {
      background: #fff; border-radius: var(--radius); width: 620px; max-width: 92vw; max-height: 82vh;
      box-shadow: 0 12px 32px rgba(0,0,0,0.25); overflow: hidden; display: flex; flex-direction: column;
    }
    .pidv-modal-head { padding: 16px 18px 12px; border-bottom: 1px solid var(--border); display: flex; align-items: center; justify-content: space-between; gap: 10px; }
    .pidv-modal-head h3 { font-size: 14.5px; font-weight: 700; color: var(--text-primary); }
    .pidv-modal-close { background: none; border: none; cursor: pointer; color: var(--text-muted); padding: 4px; }
    .pidv-modal-body { padding: 0; overflow-y: auto; }
    .pidv-hist-row { display: flex; align-items: center; gap: 10px; padding: 10px 18px; border-bottom: 1px solid var(--gray-100); font-size: 12.5px; }
    .pidv-hist-row:last-child { border-bottom: none; }
    .pidv-hist-rev { font-family: monospace; font-weight: 700; width: 34px; flex-shrink: 0; }
    .pidv-hist-file { flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; color: var(--text-secondary); display: block; }
    .pidv-hist-meta { color: var(--text-muted); font-size: 11.5px; flex-shrink: 0; text-align: right; }

    /* ── Activity Log section (Step 8 audit trail), appended below revisions
       in the same modal — same .pidv-hist-row rhythm, not a new component. ── */
    .pidv-audit-heading {
      font-size: 10px; font-weight: 700; letter-spacing: 0.08em; text-transform: uppercase;
      color: var(--text-muted); padding: 12px 18px 6px; background: var(--gray-50);
      border-top: 1px solid var(--border); border-bottom: 1px solid var(--border);
    }
    .pidv-audit-dot { width: 7px; height: 7px; border-radius: 50%; background: var(--blue-600); display: inline-block; }
    .pidv-audit-reason { font-size: 11.5px; color: var(--text-muted); font-style: italic; margin-top: 2px; }

    /* ── Links that open the actual PDF (row name, history file name) ── */
    .pidv-open-link { text-decoration: none; }
    .pidv-open-link:hover { text-decoration: underline; color: var(--blue-600) !important; }
  </style>
</head>
<body>
<div class="ll-shell">

  <!-- ═══ TOPBAR ═══ -->
  <header class="ll-topbar">
    <a class="ll-topbar-logo" href="gateway.html">
      <div class="ll-topbar-brand">
        <span class="ll-topbar-name">PIMS</span>
        <span class="ll-topbar-sub">Piping Isometrics</span>
      </div>
    </a>
    <div class="ll-topbar-div"></div>
    <div class="ll-topbar-module">
      <div class="ll-topbar-module-icon">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8">
          <path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/>
          <polyline points="14 2 14 8 20 8"/>
          <line x1="9" y1="15" x2="15" y2="15"/><line x1="9" y1="11" x2="15" y2="11"/>
        </svg>
      </div>
      <span class="ll-topbar-module-name">P&amp;IDs</span>
      <span class="ll-topbar-module-badge" id="topBadge">—</span>
    </div>
    <div class="ll-topbar-spacer"></div>
    <button class="ll-back-btn" onclick="window.close()">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M19 12H5M12 5l-7 7 7 7"/></svg>
      Back to Gateway
    </button>
  </header>

  <div class="ll-body-row">

    <!-- ═══ SIDEBAR — Job / Unit tree ═══ -->
    <nav class="pidv-sidebar">
      <div class="pidv-sidebar-label">Jobs</div>
      <div id="pidvTree"></div>
    </nav>

    <!-- ═══ CONTENT ═══ -->
    <div style="flex:1; min-width:0; display:flex; flex-direction:column; min-height:0;">

      <div class="ll-breadbar">
        <span class="ll-bc-item">PIMS</span>
        <span class="ll-bc-sep">›</span>
        <span class="ll-bc-item">P&amp;ID</span>
        <span class="ll-bc-sep">›</span>
        <span class="ll-bc-curr" id="breadCurr">P&amp;IDs</span>
        <div class="ll-bc-spacer"></div>
        <div class="ll-bc-tag" title="Read-only — to declare or upload P&amp;IDs, use P&amp;ID Index & Documents (GL / ISO Manager)">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" style="width:11px;height:11px;">
            <circle cx="12" cy="12" r="10"/><line x1="12" y1="8" x2="12" y2="12"/><line x1="12" y1="16" x2="12.01" y2="16"/>
          </svg>
          <span>View only — right-click a P&amp;ID for its revision history</span>
        </div>
      </div>

      <main class="ll-main">
        <div class="ll-card">
          <div class="ll-card-body" style="padding:0.9rem 1.25rem;">
            <div class="search-row">
              <div class="search-wrap">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="11" cy="11" r="8"/><path d="M21 21l-4.35-4.35"/></svg>
                <input class="search-input" id="pidvSearch" type="text" placeholder="Search P&amp;ID name…" oninput="pidvRenderTable()">
              </div>
              <button class="btn btn-outline btn-sm" onclick="pidvLoadAll()" style="flex-shrink:0;">↺ Refresh</button>
            </div>
          </div>
        </div>

        <div class="ll-card" style="margin-top:1rem;">
          <div class="ll-card-body no-pad">
            <div style="overflow-x:auto;max-height:68vh;">
              <table class="data-table" id="pidvTable">
                <thead id="pidvThead">
                  <tr><th><div class="empty-state" style="padding:2.5rem;">
                    <h3 style="font-size:15px;">Select a Job and Unit</h3>
                    <p>Choose a unit from the tree on the left to see its P&amp;IDs.</p>
                  </div></th></tr>
                </thead>
                <tbody id="pidvTbody"></tbody>
              </table>
            </div>
          </div>
        </div>
      </main>
    </div>
  </div>

  <!-- ═══ CONTEXT MENU ═══ -->
  <ul class="ctx-menu" id="pidvCtxMenu">
    <li data-action="history">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6">
        <circle cx="12" cy="12" r="10"/><polyline points="12 6 12 12 16 14"/>
      </svg>
      View History
    </li>
  </ul>

  <!-- ═══ HISTORY MODAL ═══ -->
  <div class="pidv-modal-overlay" id="histOverlay">
    <div class="pidv-modal">
      <div class="pidv-modal-head">
        <h3>Revision History — <span id="histPidName"></span></h3>
        <button class="pidv-modal-close" onclick="pidvCloseHistory()">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" style="width:18px;height:18px;"><line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/></svg>
        </button>
      </div>
      <div class="pidv-modal-body" id="histBody"></div>
    </div>
  </div>

</div>
<script src="js/pid-view.js"></script>
</body>
</html>
